plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.4'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.eventpulse'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(22)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter:3.4.4'
	implementation 'org.springframework.boot:spring-boot-starter-amqp:3.4.4'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis:3.4.4'
	implementation 'org.springframework.kafka:spring-kafka:3.2.4'
	implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
	compileOnly 'org.projectlombok:lombok:1.18.34'
	annotationProcessor 'org.projectlombok:lombok:1.18.34'
	testImplementation 'org.springframework.boot:spring-boot-starter-test:3.4.4'
	testImplementation 'org.springframework.amqp:spring-rabbit-test:3.2.0'
	testImplementation 'org.springframework.kafka:spring-kafka-test:3.2.4'
	testImplementation 'it.ozimov:embedded-redis:0.7.3'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.2'
}

tasks.named('test') {
	useJUnitPlatform()
}